[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tailnet-atlas"
version = "0.0.0"
description = "A private dashboard for launching and checking services across a Tailscale tailnet."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Robert Riordan" }]
dependencies = [
  "fastapi>=0.116",
  "httpx>=0.28",
  "jinja2>=3.1",
  "pydantic>=2.11",
  "pyyaml>=6.0",
  "typer>=0.16",
  "uvicorn>=0.35",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration",
]

[project.scripts]
tailnet-atlas = "tailnet_atlas.cli:app"

[project.urls]
Repository = "https://github.com/rriordan/tailnet-atlas"
Issues = "https://github.com/rriordan/tailnet-atlas/issues"

[dependency-groups]
dev = [
  "mypy>=1.17",
  "pytest>=8.4",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tailnet_atlas"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
